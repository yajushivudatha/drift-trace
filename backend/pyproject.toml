[project]
name = "drifttrace"
version = "1.0.0"
description = "Citation drift tracer: follows a claim to its source and shows where the meaning changed."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "arq>=0.26",
  "redis>=5.0",
  "httpx>=0.27",
  "lxml>=5.2",
  "rapidfuzz>=3.9",
  "rank-bm25>=0.2.2",
  "anthropic>=0.75",
  "numpy>=1.26",
  "sentence-transformers>=3.0",
  "typer>=0.12",
  "rich>=13.7",
  "reportlab>=4.2",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
drifttrace = "drifttrace.cli:app"
trace-hop = "drifttrace.cli:trace_hop_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drifttrace*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: hits real external APIs (run with --live)", "db: needs TEST_DATABASE_URL"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
